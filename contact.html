  <main>
    <section class="card-section contact-card">
      <h1 class="contact-title text-gradient">Get In Touch</h1>

      <div style="max-width: 600px; margin: 0 auto; text-align: center; margin-bottom: 2.5rem;">
        <p>
          I'm always open to discussing new projects, creative ideas, or opportunities to be part of your visions.
        </p>
      </div>

      <div class="contact-card-inner" style="max-width: 500px; margin: 0 auto;">
        <form action="https://formspree.io/f/xzzveyjp" method="POST" class="modern-form" id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your Name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="How can I help you?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
          <div id="formSuccess"
            style="display:none; text-align:center; color: var(--primary-color); font-weight: 600; margin-top: 1rem;">
            Thank you! Your message has been sent.
          </div>
        </form>
      </div>
    </section>

    <script>
      // Show a success message after form submission
      document.getElementById('contactForm').addEventListener('submit', function (e) {
        // Note: Formspree usually handles redirect, but if ajax is used:
        setTimeout(function () {
          document.getElementById('formSuccess').style.display = 'block';
        }, 500);
      });
    </script>
  </main>
